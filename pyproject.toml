[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silver_pipeline"
version = "1.0.0"
description = "Pipeline Silver dirigida por Data Contract (Bemol)"
requires-python = ">=3.10"
# Só o que o cluster NÃO tem nativo. pyspark/delta são providos pelo runtime.
dependencies = ["pydantic>=2.7", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pyspark==3.5.1", "delta-spark==3.2.0", "pytest==8.3.3", "ruff", "build"]

[project.scripts]
silver-pipeline = "silver_pipeline.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silver_pipeline = ["contracts/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E501"]
