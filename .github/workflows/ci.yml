name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # evita o flaky "sparkDriver could not bind" em runners de CI
      SPARK_LOCAL_IP: "127.0.0.1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java (Spark exige JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Testes (funções puras + engine Spark)
        env:
          JAVA_TOOL_OPTIONS: "-Djava.security.manager=allow"
        run: pytest -q

      - name: Build da wheel (prova do artefato do bundle)
        run: |
          python -m build --wheel
          ls -l dist/*.whl
